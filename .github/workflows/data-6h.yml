name: eBay listings (every 6 hours)

# Runs the site's eBay job on a schedule. The site's code and data live in a
# private repository: this public one only holds the schedule. Its address and
# every key come from secrets, and all job output goes to a file that is sent
# to the owner's dashboard, so these public logs show only done / failed.
on:
  schedule:
    - cron: '7 */6 * * *' # 00:07, 06:07, 12:07, 18:07 UTC
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  ebay:
    if: github.repository_owner == 'wizardswebwonder'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ secrets.SITE_REPO }}
          token: ${{ secrets.SITE_TOKEN }}
          # The token is not left in .git/config: only the save step uses it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Mark the start
        run: |
          echo "LOG=$RUNNER_TEMP/job.log" >> "$GITHUB_ENV"
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # --ignore-scripts: no package's install script runs on this machine
      # (the jobs only need cheerio and sharp, which work without them).
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund >> "$LOG" 2>&1 || { echo "failed"; exit 1; }; echo "done"
      - name: eBay listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          EBAY_ENV: production
        run: npm run job:ebay >> "$LOG" 2>&1 || { echo "failed (details on the dashboard)"; exit 1; }; echo "done"
      - name: Rebuild index
        run: npm run job:index >> "$LOG" 2>&1 || { echo "failed (details on the dashboard)"; exit 1; }; echo "done"
      - name: Save the data
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          {
            git config user.name "pickpc-bot"
            git config user.email "bot@users.noreply.github.com"
            git add src/data/listings src/data/catalog.index.json
            if git diff --cached --quiet; then
              echo "Nothing changed this run."
            else
              git commit -q -m "data: eBay listings (6-hourly)"
              echo "RUN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              git -c http.extraheader="$AUTH" pull -q --rebase --autostash
              git -c http.extraheader="$AUTH" push -q
            fi
          } >> "$LOG" 2>&1 || { echo "failed (details on the dashboard)"; exit 1; }
          echo "done"
      - name: Report to the dashboard
        if: always()
        env:
          JOB_REPORT_KEY: ${{ secrets.JOB_REPORT_KEY }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: node jobs/lib/report.mjs ebay ${{ job.status }} "$LOG" > /dev/null 2>&1 || true
